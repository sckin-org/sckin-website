# Decap CMS configuration.
#
# Collections only, for now. The /admin app itself (public/admin/index.html)
# and its GitHub OAuth handler are not wired yet: they need a GitHub OAuth app
# plus a token-exchange API route (no Netlify git-gateway on Vercel). See
# "Wire Decap CMS" under Future work in sckin-website-requirements.md.
# Field names below are the frontmatter contract the site reads
# (BookFrontmatter in src/lib/content.ts) — keep them in sync.

backend:
  name: github
  repo: sckin-org/sckin-website
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: books
    label: Books
    label_singular: Book
    description: >-
      Entries for /resources/books. Frontmatter only — there is no body.
      Covers: drop the image at public/images/books/{isbn}.jpg (or
      {filename}.jpg for an entry without an ISBN); without one the site
      tries Open Library, then shows a red title card.
    folder: content/books
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{order}}. {{title}} — {{author}}"
    sortable_fields: [order, title, year]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: author, label: Author, widget: string }
      - { name: publisher, label: Publisher, widget: string, required: false }
      - { name: selfPublished, label: Self-published, widget: boolean, default: false }
      - { name: year, label: Year, widget: number, value_type: int, required: false }
      - { name: edition, label: Edition, widget: string, required: false }
      - name: isbn
        label: ISBN
        widget: string
        required: false
        hint: ISBN-13, digits only. Names the self-hosted cover file and is the Open Library fallback key.
      - name: language
        label: Language
        widget: select
        multiple: true
        required: false
        hint: ISO 639-1 codes, as stored in the entries.
        options:
          - { label: English, value: en }
          - { label: French, value: fr }
          - { label: Spanish, value: es }
          - { label: Portuguese, value: pt }
          - { label: Arabic, value: ar }
      - name: audience
        label: Audience
        widget: select
        multiple: true
        options:
          - { label: Children, value: children }
          - { label: Young Adults, value: young-adults }
          - { label: Patients, value: patients }
          - { label: Caregivers, value: caregivers }
          - { label: HCP, value: hcp }
      - name: theme
        label: Theme
        widget: select
        multiple: true
        options:
          - { label: Health, value: health }
          - { label: Social, value: social }
          - { label: Memoirs, value: memoirs }
          - { label: Biography, value: biography }
          - { label: Fiction, value: fiction }
      - name: bookshopUrl
        label: Bookshop.org link
        widget: string
        required: false
        hint: Affiliate link. Shown as "Buy on Bookshop.org".
      - name: amazonUrl
        label: Amazon link
        widget: string
        required: false
        hint: Affiliate link. Shown as "Also on Amazon".
      - name: freeUrl
        label: Free-to-read link
        widget: string
        required: false
        hint: When set, "Read free" becomes the main button.
      - { name: blurb, label: Blurb, widget: text, required: false }
      - { name: zachPick, label: "Zach's Pick", widget: boolean, default: false }
      - name: order
        label: Order
        widget: number
        value_type: int
        hint: Default sort position on the page, lowest first.
